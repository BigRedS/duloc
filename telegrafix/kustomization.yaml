apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Deploy into the namespace where the CX OTel integration chart (and its
# coralogix-keys secret) already lives, so the base's secretKeyRef resolves.
namespace: coralogix

resources:
  - https://github.com/BigRedS/telegrafix?ref=main

patches:
  - path: telegraf-config.yaml
    target:
      version: v1
      kind: ConfigMap
      name: telegraf-config
