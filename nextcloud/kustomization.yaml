apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: nextcloud

resources:
  - _namespace.yaml
  - pvc.yaml
  - hooks-configmap.yaml
  - upload-config-configmap.yaml
  - deployment.yaml
  - service.yaml

generatorOptions:
  disableNameSuffixHash: true

secretGenerator:
  - name: nextcloud-secret
    envs:
      - credentials.env
    files:
      - nextcloud-s3.config.php
