apiVersion: batch/v1
kind: CronJob
metadata:
  name: mariadb-backup
  namespace: mariadb
spec:
  schedule: "0 2 * * *"
  jobTemplate:
    spec:
      template:
        spec:
          restartPolicy: OnFailure
          containers:
            - name: backup
              image: amazon/aws-cli
              env:
                - name: MINIO_ENDPOINT
                  value: http://minio.minio.svc.cluster.local:9000
                - name: BUCKET
                  value: mariadb-backups
                - name: AWS_DEFAULT_REGION
                  value: us-east-1
                - name: MYSQL_ROOT_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: mariadb-secret
                      key: MYSQL_ROOT_PASSWORD
                - name: AWS_ACCESS_KEY_ID
                  valueFrom:
                    secretKeyRef:
                      name: mariadb-backup-secret
                      key: AWS_ACCESS_KEY_ID
                - name: AWS_SECRET_ACCESS_KEY
                  valueFrom:
                    secretKeyRef:
                      name: mariadb-backup-secret
                      key: AWS_SECRET_ACCESS_KEY
              command: ["/bin/sh", "-c"]
              args:
                - |
                  dnf install -y mariadb &&
                  mysqldump -h mariadb.mariadb.svc.cluster.local \
                    -u root -p"${MYSQL_ROOT_PASSWORD}" \
                    --all-databases | gzip |
                  aws s3 cp - "s3://${BUCKET}/mariadb-$(date +%Y%m%d).sql.gz" \
                    --endpoint-url "${MINIO_ENDPOINT}" &&
                  aws s3 ls "s3://${BUCKET}/" --endpoint-url "${MINIO_ENDPOINT}" |
                    awk '{print $4}' | sort | head -n -7 |
                    xargs -r -I{} aws s3 rm "s3://${BUCKET}/{}" \
                      --endpoint-url "${MINIO_ENDPOINT}"
